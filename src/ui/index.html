<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Only this app's own files, no network, no inline or injected script.
      style-src-attr allows the style="" attributes the screens set on
      elements they build; <style> elements from anywhere else stay blocked.
      The renderer talks to the main process over IPC only, so connect-src
      is 'none'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Neutral title on purpose (D5 — disguise), and the same name the packaged app installs as (package.json build.productName). -->
    <title>Notes</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app" role="application"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
