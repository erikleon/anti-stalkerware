name: Release

# Builds an installer per OS and publishes them to a GitHub Release matching
# the pushed tag. Unsigned (see README's "Installing a packaged release" —
# no Apple/Windows signing certificate is wired up), so macOS shows a
# Gatekeeper warning and Windows shows a SmartScreen warning on first run.
#
# Gated on test.yml passing for this exact tagged commit first (via
# workflow_call) — a real regression on a release tag should block the
# release, not just get noticed after someone already downloaded it.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
