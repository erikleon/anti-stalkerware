name: Release

# Builds an installer per OS and publishes them to a GitHub Release matching
# the pushed tag. Unsigned (see README's "Installing a packaged release" —
# no Apple/Windows signing certificate is wired up), so macOS shows a
# Gatekeeper warning and Windows shows a SmartScreen warning on first run.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
